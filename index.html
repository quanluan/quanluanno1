<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>极光VIP专属导航与精选资源目录</title>
    <meta name="description" content="面向生产环境的高品质精选资源导航与VIP会员服务平台，支持自定义Logo、精选赞助广告展位、专属卡密会员机制及全功能后台管理。" />
    <meta property="og:title" content="极光VIP专属导航与精选资源目录" />
    <meta property="og:description" content="面向生产环境的高品质精选资源导航与VIP会员服务平台，支持自定义Logo、精选赞助广告展位、专属卡密会员机制及全功能后台管理。" />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%234f46e5' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'><polygon points='12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2'/></svg>" />
    
    <!-- PHP 7.4 虚拟主机自愈检测脚本 -->
    <script>
      (function() {
        var isDev = window.location.port === '3000' || (window.location.hostname === 'localhost' && window.location.port !== '');
        if (!isDev && window.location.protocol.indexOf('http') === 0) {
          // 如果当前在 PHP 虚拟主机且未直接访问 index.php，检测并优先定向到 index.php
          try {
            var xhr = new XMLHttpRequest();
            xhr.open('HEAD', 'index.php', false);
            xhr.send();
            if (xhr.status >= 200 && xhr.status < 400) {
              window.location.replace('index.php' + window.location.search + window.location.hash);
              return;
            }
          } catch(e) {}
        }
      })();
    </script>
    <style>
      body {
        margin: 0;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        background-color: #f8fafc;
        color: #1e293b;
      }
      .app-loader-wrap {
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 16px;
      }
      .app-loader-spinner {
        width: 32px;
        height: 32px;
        border: 3px solid #e2e8f0;
        border-top-color: #4f46e5;
        border-radius: 50%;
        animation: spin 0.8s linear infinite;
      }
      .app-loader-text {
        font-size: 13px;
        color: #64748b;
        font-weight: 500;
        letter-spacing: 0.025em;
      }
      @keyframes spin {
        to { transform: rotate(360deg); }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div class="app-loader-wrap">
        <div class="app-loader-spinner"></div>
        <div class="app-loader-text">系统加载中...</div>
      </div>
    </div>
    
    <!-- Vite 开发模式入口 -->
    <script type="module" src="/src/main.tsx"></script>

    <!-- 离线/静态生产环境自愈备份：若未启动开发服务器，自动平滑加载编译后的生产 Bundle -->
    <script>
      (function() {
        var isDev = window.location.port === '3000';
        if (!isDev) {
          setTimeout(function() {
            var root = document.getElementById('root');
            if (root && root.querySelector('.app-loader-spinner')) {
              var s = document.createElement('script');
              s.type = 'module';
              s.crossOrigin = 'anonymous';
              s.src = './assets/app.js';
              document.body.appendChild(s);
              var c = document.createElement('link');
              c.rel = 'stylesheet';
              c.crossOrigin = 'anonymous';
              c.href = './assets/app.css';
              document.head.appendChild(c);
            }
          }, 800);
        }
      })();
    </script>
  </body>
</html>
